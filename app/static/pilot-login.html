<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Contracts OS · Sign in</title><meta name="theme-color" content="#121a25"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icons/contracts.svg" type="image/svg+xml">
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#edf3f7;color:#162838;min-height:100vh;display:grid;place-items:center}.panel{width:min(420px,94vw);background:white;padding:36px 32px;border-radius:16px;box-shadow:0 10px 36px #182d4130}.tag{font-size:12px;letter-spacing:1.5px;color:#1883ad;font-weight:700}h1{font-size:25px;margin:12px 0 8px}.help{color:#647789;line-height:1.45;font-size:14px;margin-bottom:25px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}input{display:block;width:100%;font:inherit;border:1px solid #bacbd6;border-radius:8px;padding:12px}button{width:100%;border:0;background:#157ba4;color:white;font:inherit;font-weight:700;border-radius:8px;padding:13px;margin-top:25px;cursor:pointer}.error{font-size:13px;color:#a11f37;min-height:20px;margin-top:12px}</style></head>
<body><form class="panel" id="form"><div class="tag">PULSE FITNESS · SEPARATE TEST SYSTEM</div><h1>Contracts pilot</h1><div class="help">Sign in with your pilot account. This is separate from PulseFitness.ai and does not update its records.</div><label for="username">Username</label><input id="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" autocomplete="current-password" type="password" required><button type="submit">Sign in</button><div role="alert" class="error" id="error"></div></form><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();let error=document.getElementById('error');error.textContent='';try{let r=await fetch('/api/pilot/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!r.ok){let j=await r.json();throw Error(j.detail||'Unable to sign in')}location.assign('/')}catch(e){error.textContent=e.message}})</script><script defer src="/static/pwa-install.js"></script></body></html>
