<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse Fitness | Secure Staff Sign In</title>
<meta name="theme-color" content="#1B1C1D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/brand/pulse-fitness-blip.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/pulse-brand.css?v=pulse-brand-20261105">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;
font:14px "Proxima Nova",Arial,"Segoe UI",sans-serif;color:#1B1C1D;
background:linear-gradient(155deg,#1B1C1D 5%,#393E41 100%);padding:24px}
.login-shell{width:min(460px,100%);}
.brand{display:block;text-align:center;margin:0 auto 28px;}
.brand img{width:min(270px,82%);height:auto;display:block;margin:auto}
.panel{background:#fff;border-radius:16px;box-shadow:0 22px 64px #0005;
padding:34px;border-top:5px solid #19CDFF;}
.tag{color:#077a9b;font-size:11px;letter-spacing:.14em;font-weight:800}
h1{font-family:"MaaxRounded","Proxima Nova",Arial,sans-serif;
font-size:28px;margin:10px 0;color:#1B1C1D}
.help{line-height:1.55;color:#6E7476;margin:8px 0 23px}
label{display:block;font-weight:700;font-size:13px;margin:15px 0 6px}
input{display:block;width:100%;border:1px solid #b9c8ce;border-radius:9px;
font:inherit;padding:12px 13px;background:#fff;color:#1B1C1D}
input:focus-visible,button:focus-visible{outline:3px solid #19CDFF;outline-offset:2px}
button{display:block;width:100%;border:0;border-radius:9px;background:#19CDFF;
color:#1B1C1D;font:inherit;font-weight:800;padding:13px 16px;margin-top:22px;cursor:pointer}
button:hover{background:#00b9ec}
.error{color:#a02136;font-size:13px;min-height:20px;margin-top:12px}
.footer{color:#ccd3d5;text-align:center;font-size:12px;line-height:1.5;margin-top:18px}
</style></head>
<body><main class="login-shell">
<div class="brand"><img src="/static/brand/pulse-fitness-reverse.svg"
alt="Pulse Fitness" width="270" height="59"></div>
<form class="panel" id="form">
<div class="tag">SERVICE &amp; AFTERSALES / INTERNAL PLATFORM</div>
<h1>Welcome back.</h1>
<p class="help">Sign in to Contracts OS and SmartQuote using your approved pilot account.
This internal test environment does not change PulseFitness.ai records.</p>
<label for="username">Username</label><input id="username" autocomplete="username" required autofocus>
<label for="password">Password</label><input id="password" autocomplete="current-password" type="password" required>
<button type="submit">Sign in securely</button>
<div role="alert" class="error" id="error"></div>
</form>
<p class="footer">Pulse Fitness · The heart of fitness<br>Authorised staff access only</p>
</main>
<script>
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const error=document.getElementById('error');error.textContent='';
 try{
   const r=await fetch('/api/pilot/login',{
     method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({
       username:document.getElementById('username').value,
       password:document.getElementById('password').value
     })
   });
   if(!r.ok){const j=await r.json();throw Error(j.detail||'Unable to sign in');}
   location.assign('/');
 }catch(ex){error.textContent=ex.message;}
});
</script><script defer src="/static/pwa-install.js"></script>
</body></html>
