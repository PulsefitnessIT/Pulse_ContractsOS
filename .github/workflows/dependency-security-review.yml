name: Dependency security review
on:
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * 1'
  pull_request:
    branches: [develop, main, 'feature/**']
jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency auditor
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Check resolved direct and transitive app dependencies
        run: python -m pip_audit --requirement requirements.txt --strict
