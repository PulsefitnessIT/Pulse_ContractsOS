name: Source validation
on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    branches: [develop, main, 'feature/pwa-desktop']
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject confidential and binary runtime files
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(data|pilot_data|uploads|backups|invoices|documents|exports)/|\.(sqlite3?|db|xlsx?|xlsm|pdf|zip|pem|key|p12|pfx)$'; then
            echo 'Runtime/customer data cannot be committed to the source repository'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight API test dependency
        run: python -m pip install 'fastapi>=0.115,<1' 'lxml>=5,<7' 'pymupdf>=1.25,<2' 'pytest>=8,<10'
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Check coordinator JavaScript syntax
        run: node --check app/static/app.js && node --check app/static/accepted-quotes.js && node --check app/static/quoting-workspace.js
      - name: Unified SmartQuote draft and register regression tests
        run: python -m pytest -q tests/test_quote_drafts.py tests/test_quote_workspace.py tests/test_quote_catalogue.py tests/test_native_quote_handover.py tests/test_quote_pricing.py tests/test_quote_staging.py tests/test_quote_sage_reference.py tests/test_master_source_integrity.py
      - name: Synthetic pilot data safety tests (no customer records)
        run: python -m unittest discover -s tests -p 'test_pilot_data_*.py' -v
