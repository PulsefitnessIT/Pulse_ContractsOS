name: Source validation
on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    branches: [develop, main, 'feature/**']
jobs:
  source-safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Reject confidential and binary runtime files
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(data|pilot_data|uploads|backups|invoices|documents|exports)/|\.(sqlite3?|db|xlsx?|xlsm|pdf|zip|pem|key|p12|pfx)$'; then
            echo 'Runtime/customer data cannot be committed to the source repository'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight API test dependency
        run: python -m pip install 'fastapi>=0.115,<1' 'lxml>=5,<7' 'pymupdf>=1.25,<2' 'pytest>=8,<10' 'python-multipart>=0.0.9,<1'
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Check coordinator JavaScript syntax
        run: node --check app/static/app.js && node --check app/static/accepted-quotes.js && node --check app/static/quoting-workspace.js && node --check app/static/source-audit.js && node --check app/static/action-centre.js
      - name: Unified SmartQuote draft and register regression tests
        run: python -m pytest -q tests/test_quote_drafts.py tests/test_quote_workspace.py tests/test_quote_catalogue.py tests/test_native_quote_handover.py tests/test_quote_pricing.py tests/test_quote_reconciliation.py tests/test_v10_exact_price_kernel.py tests/test_quote_staging.py tests/test_quote_sage_reference.py tests/test_master_source_integrity.py tests/test_quote_site_lookup.py tests/test_master_sync.py tests/test_action_centre.py tests/test_ten_tab_master.py tests/test_deployment_guards.py tests/test_pilot_sessions.py tests/test_excel_upload_security.py
      - name: Synthetic pilot data safety tests (no customer records)
        run: python -m unittest discover -s tests -p 'test_pilot_data_*.py' -v
