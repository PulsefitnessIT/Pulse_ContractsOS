name: Windows single-PC pilot package

# Packaging is a controlled manual release action, not a build for every push.
# Automated SOURCE validation continues to run independently.
on:
  workflow_dispatch:
  # Isolated one-time build requested by Pulse Fitness on 18 November 2026.
  # Keep regular development/production packaging manual only.
  push:
    branches: ['release/windows-verified-2026-11-18']

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tested Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and Windows packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7" "pytest>=8,<9"

      - name: Compile bundled Python sources
        shell: pwsh
        run: python -m compileall -q app scripts

      - name: Test SmartQuote pricing, customer PDFs, security and coordinator workflow
        shell: pwsh
        run: |
          python -m pytest -q tests/test_audit_unified_prices.py tests/test_quote_price_book.py tests/test_quote_pricing.py tests/test_quote_quick_draft.py tests/test_quote_invoice_match.py tests/test_quote_customer_issuance.py tests/test_quote_commercial_setup.py tests/test_quote_coordinator_journey.py tests/test_quote_drafts.py tests/test_pilot_sessions.py tests/test_windows_local_app.py tests/test_15_tab_master.py tests/test_quote_quick_pdf.py tests/test_quote_source_setup.py tests/test_quote_rrp_priority.py tests/test_quote_release_coverage.py
          if ($LASTEXITCODE -ne 0) { throw "Critical Windows quote workflow and security regressions failed" }
          node --test tests/test_smartquote_coordinator_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw "Browser coordinator workflow tests failed" }

      - name: Build self-contained Windows desktop folder
        shell: pwsh
        run: |
          pyinstaller --paths "." --noconfirm --clean --onedir --windowed --name "Pulse Contracts OS" --add-data "app/static;app/static" --collect-submodules app --hidden-import app.main --hidden-import app.data_readiness --hidden-import app.source_integrity --collect-submodules uvicorn --collect-all pymupdf scripts/windows_local_app.py
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }

      - name: Verify actual packaged executable and static assets
        shell: pwsh
        run: |
          $exe = "dist/Pulse Contracts OS/Pulse Contracts OS.exe"
          if (!(Test-Path $exe)) { throw "Desktop executable missing" }
          # Windows GUI applications can return to PowerShell before exit;
          # wait for the real process exit code instead of $LASTEXITCODE.
          $env:PULSE_BUILD_DIAGNOSTIC_PATH = Join-Path (Get-Location) "package-selftest.log"
          $verified = Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList "--self-test" -Wait -PassThru
          if ($verified.ExitCode -ne 0) {
            if (Test-Path $env:PULSE_BUILD_DIAGNOSTIC_PATH) { Get-Content $env:PULSE_BUILD_DIAGNOSTIC_PATH }
            throw "Packaged module/asset self-test failed: $($verified.ExitCode)"
          }
          Remove-Item Env:PULSE_BUILD_DIAGNOSTIC_PATH
          $assets = "dist/Pulse Contracts OS/_internal/app/static/index.html"
          if (!(Test-Path $assets)) { throw "Pulse web UI was not bundled" }

      - name: Exercise packaged Windows startup against fictional 15-tab Master
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import runpy; runpy.run_path('tests/test_15_tab_master.py')['make_workbook'](Path('fictional_windows_smoke.xlsx'))"
          if ($LASTEXITCODE -ne 0) { throw "Could not create synthetic startup workbook" }
          $exe = (Resolve-Path "dist/Pulse Contracts OS/Pulse Contracts OS.exe").Path
          $fixture = (Resolve-Path "fictional_windows_smoke.xlsx").Path
          # This uses an isolated temp database and launches real HTTP/SQLite
          # code: a simple import check previously missed data_readiness.
          $env:PULSE_BUILD_DIAGNOSTIC_PATH = Join-Path (Get-Location) "package-startup.log"
          $verified = Start-Process -FilePath $exe -ArgumentList @("--smoke-test", $fixture) -Wait -PassThru
          if ($verified.ExitCode -ne 0) {
            if (Test-Path $env:PULSE_BUILD_DIAGNOSTIC_PATH) { Get-Content $env:PULSE_BUILD_DIAGNOSTIC_PATH }
            throw "Real Windows startup smoke test failed: $($verified.ExitCode)"
          }
          Remove-Item Env:PULSE_BUILD_DIAGNOSTIC_PATH
          Write-Host "Synthetic startup workbook retained only for post-extraction test."

      - name: Assemble validated one-extraction Windows folder and file manifest
        shell: pwsh
        run: |
          $folder = "dist/Pulse Contracts OS"
          Copy-Item "docs/WINDOWS_SINGLE_PC_INSTALL.md" "$folder/READ_ME_FIRST.md"
          # Vendored PyInstaller dependencies contain legitimate "data" paths;
          # inspect distributable files without misclassifying bundled libraries.
          $all = Get-ChildItem -Path $folder -File -Recurse
          $internal = [IO.Path]::GetFullPath((Join-Path $folder "_internal"))
          $unwanted = $all | Where-Object {
            $insideRuntime = $_.FullName.StartsWith(($internal + [IO.Path]::DirectorySeparatorChar), [StringComparison]::OrdinalIgnoreCase)
            ($_.Name -match '\.(sqlite3?|db|xlsx?|xlsm)$') -or
            ((-not $insideRuntime) -and ($_.Name -match '\.(pdf|zip)$')) -or
            ((-not $insideRuntime) -and ($_.FullName -match '\\(pilot_data|uploads|backups|invoices|private_runtime)\\'))
          }
          if (Test-Path (Join-Path $folder "data")) { throw "Unexpected private data folder at package root." }
          if ($unwanted) {
            $unwanted | ForEach-Object { Write-Host ("Blocked private data file: " + $_.FullName) }
            throw "Company data must not be included in the Windows release."
          }
          $exe = Join-Path $folder "Pulse Contracts OS.exe"
          if ((Get-Item $exe).Length -lt 1000000) { throw "Windows EXE is unexpectedly small" }
          $exeHash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$folder/EXE_SHA256.txt" -Value "$exeHash  Pulse Contracts OS.exe" -Encoding utf8
          @(
            "Pulse Fitness Contracts OS + SmartQuote - Windows verified pilot"
            "Source commit: $env:GITHUB_SHA"
            "Build branch: $env:GITHUB_REF_NAME"
            "Build time (UTC): $([DateTime]::UtcNow.ToString('u'))"
            "Runtime: Windows runner, Python 3.12, PyInstaller onedir"
            "Private data: NONE included"
            "Distribution: ONE extraction only. Keep _internal beside EXE."
            "Tested: packaged self-test, fictional 15-tab Master, HTTP login, quoting routes"
            "Commercial quote release: NOT authorised by the automated build"
          ) | Set-Content -Path "$folder/BUILD_INFO.txt" -Encoding utf8
          $base = (Resolve-Path $folder).Path
          $checks = Get-ChildItem $base -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($base.Length + 1).Replace('\','/')
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $relative"
          }
          $checks | Set-Content -Path "$folder/SHA256SUMS.txt" -Encoding utf8
          Write-Host "Verified folder staged. EXE SHA256: $exeHash"

      - name: Simulate download and extract on a completely clean Windows path
        shell: pwsh
        run: |
          $folder = "dist/Pulse Contracts OS"
          $archive = Join-Path $env:RUNNER_TEMP "smartquote-release-extraction-test.zip"
          $extracted = Join-Path $env:RUNNER_TEMP "Pulse Fitness Clean Extraction Test"
          Compress-Archive -Path "$folder/*" -DestinationPath $archive -CompressionLevel Optimal -Force
          Expand-Archive -Path $archive -DestinationPath $extracted -Force
          $manifest = Join-Path $extracted "SHA256SUMS.txt"
          if (!(Test-Path $manifest)) { throw "Extracted SHA256 manifest is missing" }
          foreach ($line in Get-Content $manifest) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2) { throw "Malformed SHA256 record" }
            $candidate = Join-Path $extracted ($parts[1].Replace('/', '\'))
            if (!(Test-Path -LiteralPath $candidate)) { throw "Missing extracted release file: $($parts[1])" }
            $actual = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "Corrupt extracted release file: $($parts[1])" }
          }
          if (!(Test-Path (Join-Path $extracted "_internal/app/static/index.html"))) { throw "Bundled static UI missing after extraction" }
          $exe = Join-Path $extracted "Pulse Contracts OS.exe"
          $env:PULSE_BUILD_DIAGNOSTIC_PATH = Join-Path $env:RUNNER_TEMP "smartquote-release-extracted-selftest.log"
          $self = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($self.ExitCode -ne 0) {
            if (Test-Path $env:PULSE_BUILD_DIAGNOSTIC_PATH) { Get-Content $env:PULSE_BUILD_DIAGNOSTIC_PATH }
            throw "Extracted executable self-test failed with exit $($self.ExitCode)"
          }
          $fixture = (Resolve-Path "fictional_windows_smoke.xlsx").Path
          $env:PULSE_BUILD_DIAGNOSTIC_PATH = Join-Path $env:RUNNER_TEMP "smartquote-release-extracted-startup.log"
          $test = Start-Process -FilePath $exe -ArgumentList @("--smoke-test", $fixture) -Wait -PassThru
          if ($test.ExitCode -ne 0) {
            if (Test-Path $env:PULSE_BUILD_DIAGNOSTIC_PATH) { Get-Content $env:PULSE_BUILD_DIAGNOSTIC_PATH }
            throw "Extracted executable startup/quote smoke test failed with exit $($test.ExitCode)"
          }
          Remove-Item Env:PULSE_BUILD_DIAGNOSTIC_PATH
          Remove-Item "fictional_windows_smoke.xlsx" -Force
          Write-Host "PASS: all SHA256 hashes, 1-pass extraction, frozen EXE, 15-tab Master, authenticated HTTP and SmartQuote routing."
          @(
            "VALIDATED: 2026-11-18 Windows desktop pilot"
            "EXTRACTION: Passed SHA-256 verification of every staged file"
            "FROZEN EXE: Passed self-test after a clean extraction to a path containing spaces"
            "STARTUP: Passed fictional 15-tab import, named sign-in, authenticated SmartQuote routes"
            "SOURCE TESTS: Pricing, invoices, quotation PDF, sessions, access, coordinator workflow"
            "LIMIT: Real customer data, commercial approval and target PC antivirus not tested"
          ) | Set-Content -Path "$folder/VALIDATION_REPORT.txt" -Encoding utf8

      - name: Publish downloadable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Pulse_Fitness_SmartQuote_ContractsOS_VERIFIED_Windows_2026_11_18
          # GitHub Actions makes ONE zip from this directory. No zip-inside-zip.
          path: dist/Pulse Contracts OS/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
